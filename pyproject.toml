[project]
name = "personal-kb-multiagent"
version = "0.3.0b1"
description = "host-delegated 个人知识库：本地检索与草稿落盘，生成工作交给 MCP Host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pydantic-settings==2.15.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
legacy = [
    # --- 图编排 ---
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",

    # --- RAG / 向量检索（本地，支持 metadata 过滤 status=promoted）---
    "chromadb>=0.5.0",
    "langchain-chroma>=0.1.4",
    "langchain-text-splitters>=0.2.0",  # MarkdownHeaderTextSplitter / RecursiveCharacterTextSplitter
    "rank-bm25>=0.2.2",                # BM25 稀疏检索（混合检索的 sparse 通道）
    "jieba>=0.42.1",                    # 中文分词（BM25 tokenization）

    # --- 本地 Embedding（BAAI/bge-m3 via sentence-transformers）---
    "langchain-huggingface>=0.1.0",     # LangChain HuggingFaceEmbeddings 适配
    "sentence-transformers>=2.7.0",     # 本地模型推理
    "modelscope>=1.18.0",              # 从魔搭社区下载模型（国内网络友好）

    # --- MCP Server（pin <2：2.0 移除了 FastMCP，1.x 才有 mcp.server.fastmcp）---
    "mcp>=1.0.0,<2.0.0",

    # --- 视频转文档：yt-dlp 获取字幕/音频 + 云端 ASR ---
    # 参考 wdkns/bilibili-render-pdf skill 的三级 fallback 方法论
    "yt-dlp>=2024.8.6",

    # --- 配置与工具 ---
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

semantic = [
    "chromadb==1.5.9",
    "langchain-chroma==1.1.0",
    "langchain-huggingface==1.2.2",
    "sentence-transformers==6.1.0",
    "modelscope==1.40.1",
]
video = ["yt-dlp==2026.8.19", "imageio-ffmpeg==0.6.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "langgraph-cli[inmem]>=0.1.50",  # 提供 langgraph dev 本地调试服务
    "ruff>=0.5.0",
]

[project.scripts]
kb-debug = "scripts.debug_run:app"
personal-kb = "local_app.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "mcp_server*", "scripts*", "local_app*", "installer*"]

[tool.setuptools.package-data]
local_app = ["static/*"]
installer = ["release.json", "requirements*.lock", "model-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_local"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
